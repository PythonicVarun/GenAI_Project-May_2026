name: Kaggle Model Deploy and Run

on:
  push:
    branches:
      - main
    paths:
      - 'outputs/local/local_model_best.pt'
      - 'outputs/local/vocab.pkl'
      - 'outputs/local/retriever.pkl'
      - 'notebooks/dl-24f2004142-notebook-t22026.ipynb'
      - 'notebooks/kernel-metadata.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Code
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 📦 Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/PythonicVarun/kaggle-cli.git@fix/obj-print"

      - name: 🚀 Run Kaggle Deploy & Inference Script
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python scripts/deploy_to_kaggle.py
