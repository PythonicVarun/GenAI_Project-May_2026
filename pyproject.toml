[project]
name = "smart-mcq-solver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Varun Agnihotri", email = "hello@pythonicvarun.me" }
]
dependencies = [
    "datasets>=4.3.0",
    "jupyterlab>=4.5.7",
    "marimo>=0.23.8",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "torch>=2.12.0",
    "tqdm>=4.67.3",
    "transformers>=5.3.0",
    "trl>=0.24.0",
    "unsloth>=2026.3.11",
    "wandb>=0.27.0",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[dependency-groups]
dev = [
    "kaggle>=2.2.0",
    "pre-commit>=4.6.0",
    "pyrefly>=1.0.0",
    "ruff>=0.15.15",
    "types-tqdm>=4.67.3.20260518",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
force-wrap-aliases = true
combine-as-imports = true
known-third-party = ["wandb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
